<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界選択 — AEOLIA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Space+Mono&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#bacbd0;color:#f8f1dc;font-family:'Shippori Mincho',serif}body{overflow-x:hidden}
.sky{position:fixed;inset:0;background:linear-gradient(#879fac,#cad5d5 52%,#e5d8c3);overflow:hidden}.sky:before,.sky:after{content:"";position:absolute;border-radius:50%;filter:blur(22px);background:#f3eee2aa}.sky:before{width:70vw;height:16vw;left:-12vw;bottom:8vh}.sky:after{width:68vw;height:18vw;right:-18vw;bottom:18vh}
main{position:relative;min-height:100vh;padding:7vh 7vw 6vh}.head{display:grid;grid-template-columns:1fr auto;align-items:end;border-bottom:1px solid #f3dfab88;padding-bottom:22px}.eyebrow,.status{font:10px 'Space Mono';letter-spacing:.22em;color:#f5d488}.head h1{font-size:clamp(42px,7vw,92px);font-weight:400;line-height:.95;letter-spacing:.09em;margin:16px 0 0;text-shadow:0 3px 18px #29465266}.clock{text-align:right;font:11px 'Space Mono';line-height:1.8;color:#f8f1dccc}
.platform{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:7vh;background:#e8d8aa66;border:1px solid #e8d8aa66}.gate{position:relative;min-height:54vh;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;color:inherit;text-decoration:none;overflow:hidden;background:#496573}.gate:before{content:"";position:absolute;inset:0;background:var(--scene);background-size:cover;opacity:.68;transition:transform .8s,opacity .4s}.gate:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,#132b38e8)}.gate:hover:before,.gate:focus-visible:before{transform:scale(1.045);opacity:.9}.gate:focus-visible{outline:3px solid #f4d37e;outline-offset:4px;z-index:3}.gate>*{position:relative;z-index:1}.number{font:10px 'Space Mono';letter-spacing:.2em;color:#f5d488}.gate h2{font-size:clamp(26px,3vw,44px);font-weight:400;letter-spacing:.08em;margin:10px 0}.gate p{font-size:12px;line-height:1.9;margin:0;max-width:34em;color:#f7f0dccc}.aeolia{--scene:url('assets/textures/sky-cities.jpg')}.parallax{--scene:url('assets/textures/complex-horizon-v1.png')}.somnia{--scene:url('assets/textures/distant-ruins.png')}
.foot{display:flex;justify-content:space-between;gap:24px;margin-top:20px;font:10px 'Space Mono';letter-spacing:.09em;color:#1e3a46}.journal{border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-decoration:underline}.sheet{position:fixed;inset:auto 6vw 6vh;z-index:5;max-height:76vh;overflow:auto;padding:30px;background:#102a38f2;border:1px solid #e8d8aa88;box-shadow:0 16px 80px #17303d99}.sheet[hidden]{display:none}.sheet button{float:right;background:none;border:1px solid #f4d37e;color:#fff;padding:7px 11px;cursor:pointer}.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;clear:both;padding-top:20px}.entry{min-height:110px;padding:15px;border:1px solid #e8d8aa55}.entry small{font:9px 'Space Mono';color:#f5d488}.entry p{font-size:12px;line-height:1.7}
@media(max-width:800px){main{padding:5vh 5vw}.platform{grid-template-columns:1fr}.gate{min-height:34vh}.clock{display:none}}
</style></head><body><div class="sky"></div><main>
<header class="head"><div><span class="eyebrow">WORLD SELECT</span><h1>世界選択</h1></div><div class="clock">3つのエリア<br><span id="found">発見 0</span></div></header>
<section class="platform" aria-label="世界を選ぶ">
<a class="gate aeolia" href="aeolia.html"><span class="number">FLOATING ISLANDS 01</span><h2>浮島の街</h2><p>街と浮島の間を飛び回る。</p></a>
<a class="gate parallax" href="liminal.html?stage=parallax"><span class="number">CLOSED COMPLEX 02</span><h2>閉鎖施設</h2><p>街区規模で連結された巨大複合施設を飛ぶ。</p></a>
<a class="gate somnia" href="liminal.html?stage=somnia"><span class="number">SOLARPUNK SUBURB 03</span><h2>郊外</h2><p>丘陵、水路、空中庭園の先まで飛ぶ。</p></a>
</section>
<footer class="foot"><span>エリアを選ぶ</span><button class="journal" id="journal">発見記録を見る</button></footer>
</main><section class="sheet" id="sheet" hidden><button id="close">閉じる</button><span class="status">DISCOVERIES</span><h2>発見記録</h2><div class="entries" id="entries"></div></section>
<script>
const notes=JSON.parse(localStorage.getItem('aeolia-notes')||'[]'),found=document.querySelector('#found');found.textContent=`発見 ${notes.length}`;
const sheet=document.querySelector('#sheet'),entries=document.querySelector('#entries');
document.querySelector('#journal').onclick=()=>{entries.innerHTML=notes.length?notes.map(n=>`<article class="entry"><small>${n.world}</small><h3>${n.name}</h3><p>${n.text}</p></article>`).join(''):'<p>まだ発見はありません。</p>';sheet.hidden=false};
document.querySelector('#close').onclick=()=>sheet.hidden=true;addEventListener('keydown',e=>{if(e.code==='Escape')sheet.hidden=true});
</script></body></html>
