<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AEOLIA trailer card</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{display:grid;place-items:center;background:#10182d;color:#f8f7f1;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
    body::before{content:"";position:fixed;inset:-25%;background:radial-gradient(circle at 78% 25%,var(--accent,#d5a55a) 0 3%,transparent 27%),radial-gradient(circle at 22% 82%,#274b77 0 7%,transparent 35%);filter:blur(18px);opacity:.42}
    main{position:relative;width:min(90vw,1120px);border-left:8px solid var(--accent,#d5a55a);padding:18px 0 24px 36px}
    .kicker{font-size:clamp(16px,2vw,26px);letter-spacing:.2em;color:var(--accent,#d5a55a);font-weight:700;margin-bottom:18px}
    h1{font-size:clamp(36px,6vw,78px);line-height:1.08;letter-spacing:.02em;margin:0 0 22px;font-weight:800}
    p{font-size:clamp(20px,2.5vw,33px);line-height:1.55;margin:0;color:#dce3ec}
    .mark{position:fixed;right:5vw;bottom:5vh;font-size:18px;letter-spacing:.16em;color:#8e9bae}
    body.scene{background-position:center;background-size:cover}
    body.scene::before{inset:0;background:linear-gradient(90deg,rgba(8,14,28,.88),rgba(8,14,28,.2) 68%,rgba(8,14,28,.08));filter:none;opacity:1}
  </style>
</head>
<body>
  <main><div class="kicker" id="kicker"></div><h1 id="title"></h1><p id="body"></p></main>
  <div class="mark">AEOLIA / 2026</div>
  <script>
    const params = new URLSearchParams(location.search);
    for (const id of ['kicker','title','body']) document.getElementById(id).textContent = params.get(id) || '';
    document.body.style.setProperty('--accent', `#${(params.get('accent') || 'd5a55a').replace(/[^0-9a-f]/gi,'')}`);
    const scenes=new Set(['floating-islands.jpg']);
    if(scenes.has(params.get('scene'))){document.body.classList.add('scene');document.body.style.backgroundImage=`url(assets/thumbnails/${params.get('scene')})`}
  </script>
</body>
</html>
