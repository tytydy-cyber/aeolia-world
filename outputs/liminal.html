<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEOLIA — 境界世界</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Space+Mono&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171c1d;color:#fff;font-family:'Shippori Mincho',serif}canvas{display:block;cursor:grab}#veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#17262edb;transition:opacity .8s}.opening{width:min(680px,86vw);border-left:1px solid #e7ca86;padding:38px}.opening small,.mono{font:10px 'Space Mono';letter-spacing:.2em;color:#e7ca86}.opening h1{font-size:clamp(44px,8vw,90px);font-weight:400;letter-spacing:.08em;margin:18px 0}.opening p{font-size:14px;line-height:2}.opening button,.return{background:#17313dcc;color:#fff;border:1px solid #e7ca86;padding:10px 15px;cursor:pointer;font:10px 'Space Mono';letter-spacing:.08em}.opening button:focus-visible,.return:focus-visible{outline:2px solid #fff;outline-offset:3px}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;padding:26px 30px;display:flex;justify-content:space-between}.brand{letter-spacing:.19em;text-shadow:0 2px 8px #000}.brand small,.place small{display:block;font:9px 'Space Mono';color:#e7ca86;margin-bottom:6px}.place{text-align:right;letter-spacing:.12em;text-shadow:0 2px 8px #000}.return{position:fixed;z-index:12;left:28px;top:82px;text-decoration:none}.help{position:fixed;right:28px;bottom:28px;z-index:11;max-width:760px;text-align:right;font:10px 'Space Mono';line-height:2.4;letter-spacing:.05em;text-shadow:0 2px 8px #000}.key{border:1px solid #ffffff88;padding:4px 7px;margin-left:8px}.event{position:fixed;z-index:12;left:50%;top:15%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .5s;text-shadow:0 2px 12px #000}.event.on{opacity:1}.event small{font:9px 'Space Mono';letter-spacing:.22em;color:#e7ca86}.event div{font-size:24px;letter-spacing:.14em;margin-top:8px}#characterControl{position:fixed;z-index:12;left:28px;bottom:63px;display:flex;gap:8px;align-items:center;font:11px system-ui;text-shadow:0 1px 5px #000}#characterControl select{color:#fff;background:#192a2dcc;border:1px solid #e7ca8690;border-radius:3px;padding:5px 8px;font:inherit}#soundControls{position:fixed;z-index:12;left:28px;bottom:96px;display:flex;gap:8px;align-items:center;font:11px system-ui;text-shadow:0 1px 5px #000}#soundControls button{font:inherit;color:#fff;background:#192a2dcc;border:1px solid #e7ca8690;border-radius:3px;padding:5px 9px;cursor:pointer}#soundControls label{display:flex;align-items:center;gap:6px}#soundControls input{width:95px;accent-color:#e7ca86}#perf{position:fixed;right:12px;top:80px;z-index:30;background:#102b3add;padding:7px;font:10px 'Space Mono';white-space:pre}.cross{position:fixed;z-index:9;left:50%;top:50%;width:4px;height:4px;border:1px solid #fff;border-radius:50%}@media(max-width:650px){.help{max-width:65%;text-align:right;line-height:3}.opening{padding:24px}#hud{padding:20px}}
</style></head><body>
<div id="veil"><section class="opening"><small id="code"></small><h1 id="title"></h1><p id="intro"></p><button id="enter">世界に入る　↗</button></section></div>
<script>{const suburb=new URLSearchParams(location.search).get('stage')==='somnia',first={code:suburb?'SOLARPUNK SUBURB 03':'COMPLEX 02',name:suburb?'郊外':'閉鎖施設',intro:suburb?'丘陵と水路の先まで、発電設備と空中庭園の郊外が続いている。':'複数の施設が街区規模で連結された、使われていない巨大複合施設。'};for(const id of ['title','worldName'])document.querySelector('#'+id)?.replaceChildren(first.name);for(const id of ['code','worldCode'])document.querySelector('#'+id)?.replaceChildren(first.code);document.querySelector('#intro').replaceChildren(first.intro)}</script>
<div id="hud"><div class="brand"><small id="worldCode"></small><span id="worldName"></span></div><div class="place"><small>NOW PASSING</small><span id="place">入口</span></div></div>
