<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { WorldAudio } from './audio.js';
import { MotionEffects } from './effects.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbacbd0);scene.fog=new THREE.FogExp2(0xbacbd0,.0028);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,1200);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.domElement.tabIndex=0;
renderer.domElement.setAttribute('aria-label','散策画面。十字キーで移動、Fで飛行、QとEで視点を回転');

sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=sun.shadow.camera.bottom=-75;sun.shadow.camera.right=sun.shadow.camera.top=75;sun.shadow.camera.far=350;sun.shadow.normalBias=.06;sun.shadow.bias=-.0002;scene.add(sun,sun.target);
const sunOrb=new THREE.Mesh(new THREE.SphereGeometry(15,24,12),new THREE.MeshBasicMaterial({color:0xffdfaa}));

const MAT={
  stone:new THREE.MeshStandardMaterial({color:0xd9d0b8,roughness:.88}),
  pale:new THREE.MeshStandardMaterial({color:0xeee5ce,roughness:.78}),
  roof:new THREE.MeshStandardMaterial({color:0x175f6d,roughness:.65}),
  roof2:new THREE.MeshStandardMaterial({color:0x8f4d3f,roughness:.75}),
  earth:new THREE.MeshStandardMaterial({color:0x6e5a45,roughness:1}),
  grass:new THREE.MeshStandardMaterial({color:0x627d65,roughness:1}),
  gold:new THREE.MeshStandardMaterial({color:0xe7ba67,roughness:.35,metalness:.35}),
  wood:new THREE.MeshStandardMaterial({color:0x72513d,roughness:.9}),
  dark:new THREE.MeshStandardMaterial({color:0x173e4a,roughness:.72})

const textureLoader=new THREE.TextureLoader();
const surfaceMaps={};
for(const kind of ['plaster','stone','slate','grass','wood','cliff']){
  const color=textureLoader.load(`assets/textures/${kind}-color.jpg`),height=textureLoader.load(`assets/textures/${kind}-height.png`);
  color.colorSpace=THREE.SRGBColorSpace;
  for(const tex of [color,height]){tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.anisotropy=4}

}
function textureMaterial(material,kind){
  material.map=surfaceMaps[kind].color;material.bumpMap=surfaceMaps[kind].height;
  material.bumpScale={plaster:.07,stone:.13,slate:.045,grass:.09,wood:.065,cliff:.3}[kind];
  material.roughness=kind==='slate'?.72:.88;material.color.setHex(kind==='slate'?0x7797a0:0xffffff);material.needsUpdate=true;
  material.userData.textureKind=kind;
}
// Project texture coordinates in meters so imported mesh UVs don't stretch the detail.
function surfaceUV(geometry,scale=3){
  const p=geometry.attributes.position,n=geometry.attributes.normal;if(!p||!n)return;
  const uv=new Float32Array(p.count*2);
  for(let i=0;i<p.count;i++){
    const nx=Math.abs(n.getX(i)),ny=Math.abs(n.getY(i)),nz=Math.abs(n.getZ(i));
    uv[i*2]=(ny>=nx&&ny>=nz?p.getX(i):nx>nz?p.getZ(i):p.getX(i))/scale;
    uv[i*2+1]=(ny>=nx&&ny>=nz?p.getZ(i):p.getY(i))/scale;
  }
  geometry.setAttribute('uv',new THREE.BufferAttribute(uv,2));
}
for(const [name,kind] of [['stone','stone'],['pale','plaster'],['roof','slate'],['roof2','slate'],['grass','grass'],['wood','wood'],['earth','cliff']])textureMaterial(MAT[name],kind);
MAT.roof2.color.setHex(0xc08a68);
const cameraBlockers=[];
const mesh=(geo,mat,pos,shadow=true)=>{if(mat.userData.textureKind)surfaceUV(geo,mat.userData.textureKind==='grass'?8:3);const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.castShadow=shadow;m.receiveShadow=shadow;scene.add(m);return m};
const box=(s,p,mat=MAT.stone,shadow=true)=>mesh(new THREE.BoxGeometry(...s),mat,p,shadow);
const cyl=(r,h,p,mat=MAT.stone,n=24)=>mesh(new THREE.CylinderGeometry(r,r*1.08,h,n),mat,p);

// Stable variations keep the same world on every visit.
let seed=8128;
function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function mainIslandScale(a){return Math.max(.83,1+.22*Math.sin(a*3+.7)+.12*Math.sin(a*5-1.1)+.055*Math.sin(a*9+.3))}
function minorIslandScale(a,phase=0){return Math.max(.76,1+.19*Math.sin(a*2+phase)+.11*Math.sin(a*5-phase*.7)+.06*Math.sin(a*9+phase*1.3))}
function island(px,top,pz,r,depth,organic=false,phase=0){
  const g=new THREE.CylinderGeometry(r,r*.18,depth,56,7),v=g.attributes.position;
  const colors=[];
  for(let i=0;i<v.count;i++){
    const xx=v.getX(i),zz=v.getZ(i),yy=v.getY(i),a=Math.atan2(zz,xx);
    const rough=(organic?mainIslandScale(a):minorIslandScale(a,phase))*(1+.022*Math.sin(yy*.21+a*4));
    v.setXYZ(i,xx*rough,yy,zz*rough);
    const shade=.63+(yy/depth+.5)*.35+.055*Math.sin(a*12+yy*.3);
    colors.push(shade,shade*.89,shade*.75);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.computeVertexNormals();
  const rock=new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,map:surfaceMaps.cliff.color,bumpMap:surfaceMaps.cliff.height,bumpScale:.24});
  const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*r*mathTau/7,uv.getY(i)*depth/7);
  mesh(g,rock,[px,top-depth/2-1,pz]);
  const cap=new THREE.CylinderGeometry(r,r,1,64,1),cv=cap.attributes.position;
  for(let i=0;i<cv.count;i++){const x=cv.getX(i),z=cv.getZ(i),a=Math.atan2(z,x),scale=organic?mainIslandScale(a):minorIslandScale(a,phase);cv.setXYZ(i,x*scale,cv.getY(i),z*scale)}
  cap.computeVertexNormals();cameraBlockers.push(mesh(cap,MAT.grass,[px,top-.5,pz]));
}
const mathTau=Math.PI*2;
const ISLANDS={tower:{x:-105,z:-105,r:29,phase:1.8},mill:{x:112,z:-92,r:25,phase:0},palace:{x:78,z:100,r:22,phase:3.7}};
island(0,3,0,67,48,true);island(-105,34,-105,29,45,false,ISLANDS.tower.phase);island(112,54,-92,25,58,false,ISLANDS.mill.phase);island(78,7,100,22,32,false,ISLANDS.palace.phase);
cameraBlockers.push(cyl(35,15,[28,10.5,-18],MAT.stone,48));
const BRIDGES=[[-48,-45,-86,-85,3,34],[47,-43,93,-78,18,54],[49,44,70,84,3,7]];
function bridgeSample(x,z,b){
  const [ax,az,bx,bz,y1,y2]=b,vx=bx-ax,vz=bz-az;
  const t=((x-ax)*vx+(z-az)*vz)/(vx*vx+vz*vz);
  if(t<0||t>1||Math.hypot(x-ax-vx*t,z-az-vz*t)>2.9)return null;
  return y1+(y2-y1)*t+Math.sin(t*Math.PI)*2;
}
// Broad staircase connects the lower plaza to the upper terrace.
for(let i=0;i<50;i++)box([8,.3,(50-i)*.6],[28,3+(i+.5)*.3,24-(i*.3)],MAT.stone);

// Stone lanes are instanced, so their small irregularities cost one draw call.
const paving=new THREE.InstancedMesh(new THREE.BoxGeometry(1.45,.09,1.15),MAT.stone,3000);
let paveCount=0;const dummy=new THREE.Object3D();
for(let xx=-60;xx<61;xx+=1.6)for(let zz=-60;zz<61;zz+=1.3){
  if(Math.hypot(xx,zz)>62||!(Math.abs(xx)<7||Math.abs(zz-18)<5||Math.hypot(xx+28,zz+28)<17))continue;
  const y=groundAt(xx,zz);dummy.position.set(xx+(random()-.5)*.12,y+.06,zz);dummy.rotation.set(0,(random()-.5)*.07,0);dummy.updateMatrix();
  paving.setMatrixAt(paveCount,dummy.matrix);paving.setColorAt(paveCount++,new THREE.Color().setHSL(.105,.16,.55+random()*.22));
}
paving.count=paveCount;paving.receiveShadow=true;scene.add(paving);

const colliders=[],houses=[];
function house(px,pz,w=12,d=10,h=10,roof=MAT.roof,y=3){
  const first=scene.children.length;
  cameraBlockers.push(box([w,h,d],[px,y+h/2,pz],MAT.pale));
  box([w+.5,.6,d+.5],[px,y+.3,pz]);
  // Pitched roofs with overlapping slate courses, deep eaves and chimney stacks.
  const rise=3.6,half=w/2+.9,slope=Math.atan2(rise,half);
  for(const side of [-1,1]){
    const r=box([Math.hypot(half,rise),.28,d+1.8],[px+side*half/2,y+h+rise/2,pz],roof);cameraBlockers.push(r);
    r.rotation.z=-side*slope;
    for(let j=1;j<9;j++){
      const rib=box([.12,.12,d+1.9],[px+side*half*j/9,y+h+rise*(1-j/9)+.17,pz],roof);rib.rotation.z=-side*slope;
    }
  }
  box([.4,.4,d+2],[px,y+h+rise,pz],roof);
  box([1.1,4.5,1.1],[px+w*.28,y+h+2,pz-d*.25]);
  box([1.45,.4,1.45],[px+w*.28,y+h+4.1,pz-d*.25]);
  box([2.2,4,.25],[px,y+2,pz+d/2+.14],MAT.dark,false);
  for(const sz of [-1,1])for(const sx of [-1,1]){
    const wx=px+sx*w*.28,wz=pz+sz*(d/2+.15);
    box([2.3,2.6,.32],[wx,y+5.5,wz],MAT.wood);
    box([1.8,2.1,.4],[wx,y+5.5,wz],MAT.dark);
    box([.1,2.1,.44],[wx,y+5.5,wz],MAT.pale);box([1.8,.12,.44],[wx,y+5.5,wz],MAT.pale);
    box([2.6,.3,.9],[wx,y+4.1,wz]);
  }
  box([w+.5,.35,d+.5],[px,y+h-.15,pz],MAT.wood);
  colliders.push({x:px,z:pz,w:w/2+.65,d:d/2+.65,bottom:y,top:y+h+3.6});
  houses.push({px,pz,y,w,d,h,roof,fallback:scene.children.slice(first)});
}
[[-43,-32,13,10],[-23,-41,11,9],[-48,-8,10,10],[-9,-27,14,9],[14,25,8,8],[43,3,9,9],[44,-25,10,9],[17,43,10,10],[-22,32,10,9]].forEach((a,i)=>house(...a,i%4?11:14,i%3?MAT.roof:MAT.roof2,groundAt(a[0],a[1])));
// Curved-looking bridge segments.
const bridgeRails=[];
function bridge(b){const [ax,az,bx,bz,y1,y2]=b,len=Math.hypot(bx-ax,bz-az),angle=Math.atan2(-(bz-az),bx-ax),steps=Math.ceil(len/.65);
  for(let i=0;i<=steps;i++){
    const t=i/steps,px=ax+(bx-ax)*t,pz=az+(bz-az)*t,y=y1+(y2-y1)*t+Math.sin(t*Math.PI)*2;
    const slab=box([len/steps+.04,.2,5.8],[px,y-.1,pz],MAT.wood);slab.rotation.y=angle;
    if(i%5===0)for(const side of [-1,1]){
      const xx=px+Math.sin(angle)*side*2.8,zz=pz+Math.cos(angle)*side*2.8;
      box([.13,1.5,.13],[xx,y+.75,zz],MAT.wood);
      const half=2.5/steps,t0=Math.max(0,t-half),t1=Math.min(1,t+half);
      const ya=y1+(y2-y1)*t0+Math.sin(t0*Math.PI)*2,yb=y1+(y2-y1)*t1+Math.sin(t1*Math.PI)*2;
      const rail=box([len/steps*5+.1,.12,.12],[xx,y+1.4,zz],MAT.wood);rail.rotation.set(0,angle,Math.atan2(yb-ya,(t1-t0)*len));bridgeRails.push(rail);
    }
  }
}
BRIDGES.forEach(bridge);

// Bell tower and windmill: landmarks visible across the map.
function tower(px,py,pz){
  cameraBlockers.push(cyl(8,30,[px,py+15,pz],MAT.pale,16));cyl(9,2,[px,py+30,pz],MAT.gold,16);
  const roof=mesh(new THREE.ConeGeometry(11,12,8),MAT.roof,[px,py+37,pz]);roof.rotation.y=Math.PI/8;
  cameraBlockers.push(roof);
  colliders.push({x:px,z:pz,radius:8.64+.65,bottom:py,top:py+29},{x:px,z:pz,radius:11+.65,bottom:py+29,top:py+43});
  for(let i=0;i<4;i++){const a=i*Math.PI/2;box([2.5,6,.3],[px+Math.sin(a)*7.9,py+23,pz+Math.cos(a)*7.9],MAT.dark,false).rotation.y=a}
}
tower(-105,33,-105);
const mill=new THREE.Group();mill.position.set(112,53,-92);scene.add(mill);
const stem=new THREE.Mesh(new THREE.CylinderGeometry(6,9,31,16),MAT.pale);stem.position.y=15.5;stem.castShadow=true;mill.add(stem);
const cap=new THREE.Mesh(new THREE.ConeGeometry(9,8,16),MAT.roof2);cap.position.y=35;mill.add(cap);
cameraBlockers.push(stem,cap);
colliders.push({x:112,z:-92,radius:9+.65,bottom:53,top:92});
const blades=new THREE.Group();blades.position.set(0,24,7.8);mill.add(blades);
for(let i=0;i<4;i++){const arm=new THREE.Group();arm.rotation.z=i*Math.PI/2;blades.add(arm);const blade=new THREE.Mesh(new THREE.BoxGeometry(.35,20,.35),MAT.wood);blade.position.y=10;arm.add(blade);for(let j=5;j<20;j+=1){const slat=new THREE.Mesh(new THREE.BoxGeometry(3,.5,.15),MAT.pale);slat.position.set(1,j,0);arm.add(slat)}}

// Gnarled trunks, branches and varied crowns share five instanced draw batches.
const leaves=[0x405b3f,0x637a4e,0x839064].map(color=>new THREE.MeshStandardMaterial({color,roughness:.94}));
const treeParts={trunk:[],branch:[],leaf0:[],leaf1:[],leaf2:[]},treeBatches=[],treeUp=new THREE.Vector3(0,1,0);
function tree(px,py,pz,s=1){
  dummy.position.set(px,py+2.8*s,pz);dummy.rotation.set(.05*Math.sin(px),0,.07*Math.sin(pz));dummy.scale.set(.72*s,1.15*s,.72*s);dummy.updateMatrix();treeParts.trunk.push(dummy.matrix.clone());

function update(dt,t){
